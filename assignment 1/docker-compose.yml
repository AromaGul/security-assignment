
services:
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: lab-juiceshop
    ports:
      - "127.0.0.1:3000:3000"

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: lab-dvwa
    ports:
      - "127.0.0.1:8090:80"

  webgoat:
    image: webgoat/webgoat:latest
    container_name: lab-webgoat
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9090:9090"

  bwapp:
    image: raesene/bwapp:latest
    container_name: lab-bwapp
    ports:
      - "127.0.0.1:8082:80"

  mutillidae:
    image: citizenstig/nowasp:latest
    container_name: lab-mutillidae
    ports:
      - "127.0.0.1:8083:80"
